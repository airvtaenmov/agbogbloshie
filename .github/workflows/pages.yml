
name: Publish Agbogbloshie

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build self-contained static site
        run: |
          set -euxo pipefail
          mkdir -p _site/vendor
          cp index.html favicon.svg _site/
          touch _site/.nojekyll

          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/mrdoob/three.js/r160/build/three.module.min.js \
            --output _site/vendor/three.module.min.js

          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/mrdoob/three.js/r160/LICENSE \
            --output _site/vendor/THREE-LICENSE.txt

          test $(wc -c < _site/vendor/three.module.min.js) -gt 500000
          grep -q 'SPDX-License-Identifier: MIT' _site/vendor/three.module.min.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
